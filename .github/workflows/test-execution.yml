name: Build and Test
on:
  workflow_dispatch:

jobs:
  local-test:
    runs-on: ubuntu-latest

    env:
      USERNAME: ${{ secrets.HEROKU_USERNAME }}
      PASSWORD: ${{ secrets.HEROKU_PASSWORD }}
      TARGET: local
      SUITE: local
      BROWSER: chrome
      HEADLESS: true

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: oracle

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -q -DskipTests package

      - name: Run local tests
        run: mvn -q test -Pweb-execution -Dsuite=${{ env.SUITE }} -Dtarget=${{ env.TARGET }} -Dheadless=${{ env.HEADLESS }} -Dbrowser=${{ env.BROWSER }}